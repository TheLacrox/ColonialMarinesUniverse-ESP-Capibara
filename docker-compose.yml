name: capibara-colonial-marines

services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Robust.Server is PID 1 and handles SIGTERM on AppDomain ProcessExit with its own
    # internal 10s kill timer. 30s leaves room to flush preferences.db.
    stop_grace_period: 30s
    ports:
      # Host port is configurable (SS14_PORT) so several SS14 servers can share one host;
      # inside the container the server always listens on 1212.
      - "${SS14_PORT:-1212}:1212/udp"   # gameplay - Traefik cannot proxy UDP, must be a direct host port
      - "${SS14_PORT:-1212}:1212/tcp"   # status/launcher/ACZ - can also be fronted by Dokploy/Traefik with HTTPS
    volumes:
      - ss14-data:/data
    environment:
      # Empty default -> entrypoint skips the --cvar and the baked value in
      # Docker/server_config.prod.toml (or the Capibara preset) wins.
      # Set these in Dokploy only to override.
      SS14_HOSTNAME: "${SS14_HOSTNAME:-}"
      SS14_DOMAIN: "${SS14_DOMAIN:-}"
      SS14_PORT: "${SS14_PORT:-1212}"
      SS14_HUB_ADVERTISE: "${SS14_HUB_ADVERTISE:-true}"
      SS14_AUTH_MODE: "${SS14_AUTH_MODE:-1}"
      SS14_HOST_USER: "${SS14_HOST_USER:-}"
      # Generic escape hatch for ANY cvar, e.g. "hub.advertise=false;replay.auto_record=true".
      # Read natively by RobustToolbox (Robust.Shared/Configuration/EnvironmentVariables.cs).
      # Overrides server_config.toml and every preset; loses only to the explicit --cvar
      # flags in entrypoint.sh. No rebuild needed.
      ROBUST_CVARS: "${ROBUST_CVARS:-}"

volumes:
  ss14-data:
